[project]
name = "ai-worker"
version = "0.1.0"
description = "Autonomous AI Task Worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "playwright>=1.42.0",
    "pytest>=8.1.0",
    "PyMuPDF>=1.24.0",
    "pillow>=10.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "openai>=1.14.0",
]

[tool.vercel]
entrypoint = "acme_ops.app:app"
